# Fund Lab — static site, behind basic auth.
#
# The page carries a real portfolio: tickers, euro values, total net worth.
# On a public IP that is personal financial data one guessed URL away from
# anyone, so auth is not optional garnish here. noindex helps with crawlers
# that respect it and does nothing about anyone who has the address.

server {
    listen 80;
    server_name 46.202.140.61;

    root /var/www/fundlab;
    index index.html;

    auth_basic           "Bond Portfolio Centre";
    auth_basic_user_file /etc/nginx/.htpasswd-fundlab;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    # text/html is always gzipped and must not be listed - nginx warns about
    # a duplicate MIME type if it is.
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }

    # The transaction API. It binds to localhost only and is reached solely
    # through here, so the basic auth above is the single door to a service
    # that can change share counts in a live spreadsheet.
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        client_max_body_size 64k;
    }

    # The payload is rebuilt daily at most; let the browser keep it briefly
    # but never serve a stale copy after a rebuild.
    location = /data.json {
        add_header Cache-Control "no-cache";
    }
}
