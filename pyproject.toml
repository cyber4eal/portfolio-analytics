[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-analytics"
version = "0.1.0"
description = "Risk, Monte Carlo and diversification analytics for a portfolio, ported off Google Sheets."
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
# Only needed to import broker statements and the pension PDF.
statements = ["xlrd>=2.0.1", "pypdf>=4.0"]
fundengine = ["yfinance>=0.2.40", "requests>=2.32", "google-api-python-client>=2.130",
              "google-auth>=2.30", "python-dotenv>=1.0"]

dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["portfolio_analytics*", "fundengine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
