[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-analytics"
version = "0.1.0"
description = "Risk, Monte Carlo and diversification analytics for a portfolio, ported off Google Sheets."
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["portfolio_analytics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
